name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET Release build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/FujiyBlog.sln

      - name: Build solution
        run: dotnet build src/FujiyBlog.sln --configuration Release --no-restore

      - name: Publish web application locally
        run: dotnet publish src/FujiyBlog.Web/FujiyBlog.Web.csproj --configuration Release --no-build --no-restore --output "${{ runner.temp }}/fujiyblog-publish"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image locally
        run: docker build --file src/FujiyBlog.Web/Dockerfile --tag fujiyblog:ci src
